plugins {
    id 'com.android.application'
}

def startUrl = (project.findProperty('START_URL') ?: 'file:///android_asset/preview.html').toString()

android {
    namespace 'com.shivai.shivix'
    compileSdk 34

    defaultConfig {
        applicationId "com.shivai.shivix"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "START_URL", "\"${startUrl}\""
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
